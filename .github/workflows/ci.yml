name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.17.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check documentation links and screenshots
        run: npm run docs:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_START_BACKEND: "1"
      E2E_PRODUCTION: "1"
      E2E_BASE_URL: http://localhost:3001
      API_PROXY_TARGET: http://localhost:4001
      E2E_BACKEND_DIR: ../backend
    steps:
      - name: Check out frontend
        uses: actions/checkout@v6
        with:
          path: frontend

      - name: Check out reviewed disposable backend fixture
        uses: actions/checkout@v6
        with:
          repository: ShoyebWritesCode/Doctor-Tracker-Backend
          ref: 86ac684d492a861efa8ffbbc907b4f3cea2f4190
          path: backend

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend fixture dependencies
        working-directory: backend
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production workflows and accessibility
        run: npm run test:e2e -- --project=${{ matrix.project }}

      - name: Upload browser audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-${{ matrix.project }}
          path: frontend/test-results
          retention-days: 7
